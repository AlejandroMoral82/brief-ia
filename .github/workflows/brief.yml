name: brief diario

on:
  schedule:
    # 04:30 UTC = 06:30 en Espana (verano) / 05:30 (invierno).
    # Actions no ejecuta a la hora exacta: programa con margen.
    - cron: "0 4 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:        # boton para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generar el brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m pipeline.build

      - name: Commit si hay cambios
        run: |
          git config user.name  "brief-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "sin cambios"
            exit 0
          fi
          git commit -m "brief $(date -u +%Y-%m-%d)"

          # Si alguien ha subido algo a la rama mientras corria el pipeline,
          # el push se rechaza: se rebasa sobre lo nuevo y se reintenta una vez.
          rama="${GITHUB_REF_NAME}"
          for intento in 1 2; do
            if git pull --rebase origin "$rama" && git push origin "HEAD:$rama"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push fallido (intento $intento)"
            sleep 10
          done
          exit 1
